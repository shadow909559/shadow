<!DOCTYPE html>
<html>
<head>
  <title>Notices - Smart College Navigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      background: #f4f8ff;
    }

    .sidebar {
      width: 240px;
      height: 100vh;
      background: white;
      border-right: 1px solid #e0e0e0;
      padding: 25px 20px;
      position: fixed;
    }

    .sidebar h2 {
      color: #1a73e8;
      margin-bottom: 40px;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: #333;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    .sidebar a:hover {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .main {
      margin-left: 240px;
      width: 100%;
    }

    .topbar {
      background: #1a73e8;
      color: white;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .content {
      padding: 40px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 40px;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 30px rgba(0,0,0,0.08);
    }

    h3 {
      margin-bottom: 20px;
      color: #1a73e8;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #1a73e8;
      outline: none;
      box-shadow: 0 0 0 2px #e8f0fe;
    }

    button {
      padding: 10px 18px;
      background: #1a73e8;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1558b0;
    }

    .notice-card {
      border: 1px solid #e0e0e0;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #f9fbff;
      transition: 0.3s;
    }

    .notice-card:hover {
      background: #e8f0fe;
    }

    .small-text {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>

<body>
<div class="sidebar">
  <h2>College</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="notices.html">Notices</a>
</div>

<div class="main">
  <div class="topbar">
    College Notices
  </div>

  <div class="content">
    <div class="card" id="adminNoticeCard">
      <h3>Add Notice (Admin)</h3>
      <input type="text" id="noticeTitle" placeholder="Notice Title">
      <textarea id="noticeContent" placeholder="Notice Content"></textarea>
      <button id="addNoticeBtn">Add Notice</button>
    </div>

    <div class="card">
      <h3>All Notices</h3>
      <div id="noticesList"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzMLug_TU5BW7fxEpAND4KiyVjeWcxcrs",
  authDomain: "college-location-app.firebaseapp.com",
  projectId: "college-location-app",
  storageBucket: "college-location-app.firebasestorage.app",
  messagingSenderId: "1000054805371",
  appId: "1:1000054805371:web:93f13c5f877dba7b6863de"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const noticesList = document.getElementById("noticesList");
const addNoticeBtn = document.getElementById("addNoticeBtn");
const noticeTitle = document.getElementById("noticeTitle");
const noticeContent = document.getElementById("noticeContent");
const adminNoticeCard = document.getElementById("adminNoticeCard");

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  if (user.email !== "kendrerushikesh1234@gmail.com") {
    adminNoticeCard.style.display = "none";
  }
});

const q = query(collection(db, "notices"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
  noticesList.innerHTML = "";

  snapshot.forEach((docSnap) => {
    const notice = docSnap.data();
    const date = notice.timestamp?.toDate().toLocaleString() || "";

    let deleteButton = "";

    if (auth.currentUser?.email === "kendrerushikesh1234@gmail.com") {
      deleteButton = `<button onclick="deleteNotice('${docSnap.id}')">Delete</button>`;
    }

    noticesList.innerHTML += `
      <div class="notice-card">
        <h4>${notice.title}</h4>
        <p>${notice.content}</p>
        <div class="small-text">${date}</div>
        ${deleteButton}
      </div>
    `;
  });
});

addNoticeBtn.addEventListener("click", async () => {
  if (noticeTitle.value === "" || noticeContent.value === "") {
    alert("Please fill all fields");
    return;
  }

  await addDoc(collection(db, "notices"), {
    title: noticeTitle.value,
    content: noticeContent.value,
    timestamp: new Date()
  });

  noticeTitle.value = "";
  noticeContent.value = "";
});

window.deleteNotice = async (id) => {
  if (confirm("Are you sure you want to delete this notice?")) {
    await deleteDoc(doc(db, "notices", id));
  }
};
</script>

</body>
</html>
