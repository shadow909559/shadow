<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester & Subject Wise Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #f8fafc; min-height: 100vh; overflow-x: hidden; }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; }
        .view { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; }

        .login-container { max-width: 400px; margin: 8vh auto; text-align: center; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; }
        input, select { width: 100%; padding: 12px 12px 12px 40px; border-radius: 8px; border: 1px solid var(--border); background: #1e293b; color: white; outline: none; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1rem; border-radius: 0.8rem; margin-bottom: 1.5rem; }
        .timer-box { display: flex; align-items: center; gap: 15px; font-size: 1.3rem; color: #fbbf24; }
        #warning-badge { background: var(--danger); padding: 4px 10px; border-radius: 4px; color: white; font-size: 0.8rem; }

        .exam-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .option-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; margin-bottom: 10px; transition: 0.2s; }
        .option-item.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); }

        .nav-controls { display: flex; justify-content: space-between; margin-top: 30px; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .palette-btn { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #1e293b; color: white; cursor: pointer; }
        .palette-btn.active { border: 2px solid white; }
        .palette-btn.attempted { background: var(--success); }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-secondary { background: #475569; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; }
        .btn-success { background: var(--success); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        #proctor-video { position: fixed; top: 15px; right: 15px; width: 160px; height: 120px; border-radius: 12px; border: 2px solid var(--primary); z-index: 1000; display: none; background: #000; transform: scaleX(-1); object-fit: cover; }

        .result-container { max-width: 400px; margin: 10vh auto; text-align: center; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--primary); line-height: 120px; margin: 20px auto; font-size: 2rem; font-weight: bold; text-align: center;}
    </style>
</head>
<body>

    <video id="proctor-video" autoplay playsinline muted></video>

    <div id="app">
        <!-- Login Section -->
        <section id="login-view" class="view active">
            <div class="glass-card login-container">
                <div class="brand">
                    <i class="fas fa-university fa-3x"></i>
                    <h1>Examination Portal</h1>
                    <p>Select your semester and subject to begin</p>
                </div>
                <form id="login-form">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="student-name" placeholder="Name (e.g. Saniya Shaikh)" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-id-badge"></i>
                        <input type="text" id="roll-no" placeholder="Roll No (e.g. 39)" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="text" id="admit-card" placeholder="ID (e.g. AC001)" required>
                    </div>
                    
                    <!-- Semester Dropdown -->
                    <div class="input-group">
                        <i class="fas fa-graduation-cap"></i>
                        <select id="semester-select" onchange="updateSubjects()" required>
                            <option value="" disabled selected>Select Semester</option>
                            <option value="SEM1">Semester 1</option>
                            <option value="SEM2">Semester 2</option>
                            <option value="SEM3">Semester 3</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-layer-group"></i>
                        <select id="year-select" onchange="updateSubjects()" required>
                            <option value="" disabled selected>Select Year</option>
                            <option value="FY">First Year (FY)</option>
                            <option value="SY">Second Year (SY)</option>
                            <option value="TY">Third Year (TY)</option>
                        </select>
                    </div>

                    <!-- Subject Dropdown -->
                    <div class="input-group">
                        <i class="fas fa-book"></i>
                        <select id="subject-select" required disabled>
                            <option value="" disabled selected>First Select Semester</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Verify & Start Exam</button>
                </form>
            </div>
        </section>

        <!-- Exam Section -->
        <section id="exam-view" class="view">
            <header class="dashboard-header">
                <div class="user-meta">
                    <span id="display-name" style="font-weight:bold; color: #6366f1;"></span>
                    <span id="display-details" style="margin-left: 15px; color: #94a3b8;"></span>
                </div>
                <div class="timer-box">
                    <span id="warning-badge">Warnings: 0</span>
                    <i class="fas fa-clock"></i> <span id="timer">10:00</span>
                </div>
            </header>

            <main class="exam-layout">
                <div class="question-section glass-card">
                    <div id="question-container">
                        <h3 id="q-text">Loading...</h3>
                        <div id="options-container" class="options-grid"></div>
                    </div>
                    <div class="nav-controls">
                        <button class="btn-secondary" onclick="prevQuestion()">Previous</button>
                        <button class="btn-success" onclick="endExam()">Finish Exam</button>
                        <button class="btn-primary" onclick="nextQuestion()">Next</button>
                    </div>
                </div>

                <aside class="sidebar">
                    <div class="palette-card glass-card">
                        <h4>Questions</h4>
                        <div id="question-palette" class="palette-grid"></div>
                    </div>
                </aside>
            </main>
        </section>

        <!-- Result Section -->
        <section id="result-view" class="view">
            <div class="glass-card result-container">
                <h2>Exam Submitted</h2>
                <div class="score-circle"><span id="final-score">0</span>%</div>
                <h3 id="pass-fail-status"></h3>
                <p id="warning-final-msg" style="color: #94a3b8; margin-top: 10px;"></p>
                <button onclick="location.reload()" class="btn-primary" style="width:100%; margin-top: 20px;">Exit</button>
            </div>
        </section>
    </div>

<script type="module">

// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
    getFirestore,
    collection,
    doc,
    setDoc,
    getDoc,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBzMLug_TU5BW7fxEpAND4KiyVjeWcxcrs",
    authDomain: "college-location-app.firebaseapp.com",
    projectId: "college-location-app"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let userEmail = null;
let questionBankCache = [];

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const userSnap = await getDoc(doc(db, "users", user.uid));
    const userDoc = userSnap.exists() ? userSnap.data() : null;
    if (!userDoc || userDoc.role !== "student") {
        await signOut(auth);
        window.location.href = "admin.html";
        return;
    }

    userEmail = user.email;

    try {
        const snapshot = await getDocs(collection(db, "questionBank"));
        questionBankCache = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        window.updateSubjects();
    } catch (e) {
        console.error("Failed to load question bank:", e);
    }
});

let state = {
    user: null,
    year: "",
    semester: "",
    subject: "",
    questions: [],
    currentIdx: 0,
    answers: {},
    timer: 600,
    timerInterval: null,
    warnings: 0
};

// ================= SUBJECT UPDATE =================
window.updateSubjects = function () {

    const semSelect = document.getElementById('semester-select');
    const yearSelect = document.getElementById('year-select');
    const subSelect = document.getElementById('subject-select');
    const selectedSem = semSelect.value;
    const selectedYear = yearSelect.value;

    subSelect.innerHTML =
        '<option value="" disabled selected>Select Subject</option>';

    if (!selectedSem || !selectedYear) {
        subSelect.disabled = true;
        subSelect.innerHTML =
            '<option value="" disabled selected>First Select Semester and Year</option>';
        return;
    }

    if (!questionBankCache.length) {
        subSelect.disabled = true;
        subSelect.innerHTML =
            '<option value="" disabled selected>Loading subjects...</option>';
        return;
    }

    const subjects = new Set();
    questionBankCache.forEach((q) => {
        if (q.year === selectedYear && q.semester === selectedSem && q.subject) {
            subjects.add(q.subject);
        }
    });

    if (!subjects.size) {
        subSelect.disabled = true;
        subSelect.innerHTML =
            '<option value="" disabled selected>No subjects available</option>';
        return;
    }

    subSelect.disabled = false;
    Array.from(subjects).sort().forEach((subject) => {
        const opt = document.createElement('option');
        opt.value = subject;
        opt.innerText = subject;
        subSelect.appendChild(opt);
    });
};

// ================= PROCTOR =================
function initProctoring() {

    const video = document.getElementById('proctor-video');

    navigator.mediaDevices.getUserMedia({ video: true })

        .then(stream => {

            video.srcObject = stream;
            video.style.display = 'block';

        })

        .catch(() => alert("Camera permission required!"));

    window.onblur = () => {

        state.warnings++;

        document.getElementById('warning-badge').innerText =
            "Warnings: " + state.warnings;

        if (state.warnings >= 3) {

            alert("TERMINATED: 3 warnings reached.");

            window.endExam(true);

        } else {

            alert(`WARNING ${state.warnings}/3: Do not switch tabs!`);
        }
    };
}

// ================= LOGIN =================
document.getElementById('login-form')
.addEventListener('submit', async function (e) {

    e.preventDefault();

    const n = document.getElementById('student-name').value.trim();

    const r = document.getElementById('roll-no').value.trim();

    const i = document.getElementById('admit-card').value.trim();

    const sem = document.getElementById('semester-select').value;

    const yr = document.getElementById('year-select').value;

    const sub = document.getElementById('subject-select').value;

    if (!userEmail) {
        alert("Please login again.");
        window.location.href = "login.html";
        return;
    }

    // ================= FIREBASE CHECK =================
    const examId = yr + "_" + sem + "_" + sub.replace(/\s/g, "_");

    const resultRef =
        doc(db, "results", userEmail + "_" + examId);

    const snap = await getDoc(resultRef);

    if (snap.exists()) {

        alert("Exam already completed!");

        return;
    }

    const selectedQuestions = questionBankCache
        .filter((q) => q.year === yr && q.semester === sem && q.subject === sub)
        .map((q) => ({
            q: q.questionText,
            options: q.options,
            correct: q.correctAnswer
        }));

    if (!selectedQuestions.length) {
        alert("No questions available for this selection.");
        return;
    }

    state.user = { name: n, roll: r, id: i };

    state.year = yr;

    state.semester = sem;

    state.subject = sub;

    state.questions = selectedQuestions;

    startExam();
});

// ================= START =================
function startExam() {

    document.getElementById('login-view')
        .classList.remove('active');

    document.getElementById('exam-view')
        .classList.add('active');

    document.getElementById('display-name').innerText =
        "Student: " + state.user.name;

    document.getElementById('display-details').innerText =
        `| ${state.year} ${state.semester} - ${state.subject}`;

    initProctoring();

    state.timerInterval = setInterval(() => {

        state.timer--;

        let m = Math.floor(state.timer / 60);

        let s = state.timer % 60;

        document.getElementById('timer').innerText =
            `${m}:${s < 10 ? '0' : ''}${s}`;

        if (state.timer <= 0) {
            window.endExam(true);
        }

    }, 1000);

    window.loadQuestion(0);
}

// ================= LOAD QUESTION =================
window.loadQuestion = function (idx) {

    state.currentIdx = idx;

    const q = state.questions[idx];

    document.getElementById('q-text').innerText =
        (idx + 1) + ". " + q.q;

    const container =
        document.getElementById('options-container');

    container.innerHTML = '';

    q.options.forEach((opt, i) => {

        const div = document.createElement('div');

        div.className =
            `option-item ${state.answers[idx] === i ? 'selected' : ''}`;

        div.innerText = opt;

        div.onclick = () => {

            state.answers[idx] = i;

            window.loadQuestion(idx);
        };

        container.appendChild(div);
    });

    updatePalette();
};

// ================= NAVIGATION =================
window.nextQuestion = () => {

    if (state.currentIdx < state.questions.length - 1)

        window.loadQuestion(state.currentIdx + 1);
};

window.prevQuestion = () => {

    if (state.currentIdx > 0)

        window.loadQuestion(state.currentIdx - 1);
};

// ================= SAVE RESULT =================
window.endExam = async function (forced = false) {

    if (!forced && !confirm("Submit exam?")) return;

    clearInterval(state.timerInterval);

    window.onblur = null;

    let score = 0;

    state.questions.forEach((q, i) => {

        if (state.answers[i] === q.correct)
            score++;
    });

    const percentage =
        Math.round((score / state.questions.length) * 100);

    // ================= FIREBASE SAVE =================
    const examId =
        state.year + "_" + state.semester + "_" + state.subject.replace(/\s/g, "_");

    await setDoc(
        doc(db, "results", userEmail + "_" + examId),
        {
            email: userEmail,
            student: state.user.name,
            roll: state.user.roll,
            year: state.year,
            semester: state.semester,
            subject: state.subject,
            score: score,
            total: state.questions.length,
            percentage: percentage,
            warnings: state.warnings,
            timestamp: new Date()
        }
    );

    // ================= RESULT UI =================
    document.getElementById('exam-view')
        .classList.remove('active');

    document.getElementById('result-view')
        .classList.add('active');

    document.getElementById('final-score').innerText =
        percentage;

    document.getElementById('pass-fail-status').innerText =
        percentage >= 40 ? "QUALIFIED" : "FAIL";

    document.getElementById('warning-final-msg').innerText =
        "Security Warnings: " + state.warnings;

    const v = document.getElementById('proctor-video');

    if (v.srcObject)
        v.srcObject.getTracks().forEach(t => t.stop());

    v.style.display = 'none';
};

// ================= PALETTE =================
function updatePalette() {

    const p =
        document.getElementById('question-palette');

    p.innerHTML = '';

    state.questions.forEach((_, i) => {

        const b = document.createElement('button');

        b.innerText = i + 1;

        b.className =
            `palette-btn ${i === state.currentIdx ? 'active' : ''}
            ${state.answers[i] !== undefined ? 'attempted' : ''}`;

        b.onclick = () => window.loadQuestion(i);

        p.appendChild(b);
    });
}

</script>
</body>
</html>
