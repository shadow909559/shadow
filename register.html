<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Register - College Location App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .register-container {
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .register-header {
      padding: 2rem 1.5rem;
      color: #ffffff;
      text-align: center;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .register-header h1 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    .register-header p {
      opacity: 0.92;
    }

    .register-form {
      padding: 2rem 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333333;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #4facfe;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
    }

    .status-message {
      display: none;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status-message.show {
      display: block;
    }

    .status-message.info {
      color: #075985;
      background: #e0f2fe;
    }

    .status-message.success {
      color: #047857;
      background: #d1fae5;
    }

    .status-message.error {
      color: #b91c1c;
      background: #fee2e2;
    }

    .register-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 5px;
      color: #ffffff;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .register-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
    }

    .register-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .register-footer {
      padding: 1rem 1.5rem;
      text-align: center;
      border-top: 1px solid #e0e0e0;
      background: #f9f9f9;
    }

    .register-footer p {
      margin: 0.5rem 0;
      color: #666666;
      font-size: 0.9rem;
    }

    .register-footer a {
      color: #4facfe;
      font-weight: 700;
      text-decoration: none;
    }

    .register-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1>Student Register</h1>
      <p>Create your student portal account</p>
    </div>

    <div class="register-form">
      <div id="status-message" class="status-message"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="student@college.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required autocomplete="new-password" minlength="6">
        </div>

        <button type="submit" class="register-btn" id="register-btn">Register as Student</button>
      </form>
    </div>

    <div class="register-footer">
      <p>Already have an account? <a href="/student-login.html">Student Login</a></p>
      <p><a href="/">Back to Home</a></p>
    </div>
  </div>

  <script type="module">
    import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js';
    import { auth, createUserDoc, getUserDoc } from './config/firestore-schema.js';
    import { cacheUser } from './utils/auth-helper.js';

    const registerForm = document.getElementById('register-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const registerBtn = document.getElementById('register-btn');
    const statusMessage = document.getElementById('status-message');

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!name || !email || !password) {
        showStatus('Please fill in all fields.', 'error');
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Registering...';
      showStatus('Creating your student account...', 'info');

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const created = await createUserDoc(user.uid, user.email, name, 'student');

        if (!created) {
          throw new Error('Could not create the student profile.');
        }

        const userDoc = await getUserDoc(user.uid);
        cacheUser(user, userDoc || {
          uid: user.uid,
          email: user.email,
          name,
          role: 'student'
        });

        showStatus('Registration successful. Opening your dashboard...', 'success');
        setTimeout(() => {
          window.location.href = '/student-dashboard.html';
        }, 600);
      } catch (error) {
        console.error('Registration error:', error);
        showStatus(getRegisterErrorMessage(error), 'error');
        registerBtn.disabled = false;
        registerBtn.textContent = 'Register as Student';
      }
    });

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message show ${type}`;
    }

    function getRegisterErrorMessage(error) {
      if (error.code === 'auth/email-already-in-use') {
        return 'This email is already registered. Please use Student Login.';
      }

      if (error.code === 'auth/invalid-email') {
        return 'Please enter a valid email address.';
      }

      if (error.code === 'auth/weak-password') {
        return 'Password should be at least 6 characters.';
      }

      return error.message || 'Registration failed. Please try again.';
    }
  </script>
</body>
</html>
