<!DOCTYPE html>
<html>
<head>
  <title>Login - Smart College Navigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
    }

    .login-wrapper {
      width: 900px;
      max-width: 95%;
      height: 550px;
      display: flex;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      background: white;
      animation: fadeIn 0.6s ease-in-out;
    }

    .left-panel {
      flex: 1;
      background: #1565c0;
      color: white;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left-panel h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .left-panel p {
      opacity: 0.9;
      line-height: 1.6;
    }

    .right-panel {
      flex: 1;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel h2 {
      margin-bottom: 30px;
      color: #1565c0;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: 0.3s;
      font-size: 14px;
    }

    input:focus {
      border-color: #1565c0;
      outline: none;
      box-shadow: 0 0 0 2px rgba(21,101,192,0.2);
    }

    button {
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #1565c0;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 15px;
    }

    button:hover {
      background: #0d47a1;
      transform: translateY(-2px);
    }

    .secondary-btn {
      background: #f1f3f4;
      color: #333;
    }

    .secondary-btn:hover {
      background: #e0e0e0;
    }

    .register-link {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .register-link a {
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    #statusMsg {
      font-size: 14px;
      min-height: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media(max-width: 768px) {
      .login-wrapper {
        flex-direction: column;
        height: auto;
      }
      .left-panel {
        padding: 40px;
      }
      .right-panel {
        padding: 40px;
      }
    }

  </style>
</head>
<body>

<div class="login-wrapper">

  <div class="left-panel">
    <h1>Smart College Navigation 🎓</h1>
    <p>
      Access campus navigation, online notices, exam timetable,
      and your academic dashboard — all in one smart platform.
    </p>
  </div>

  <div class="right-panel">
    <h2>Student Login</h2>

    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button id="loginBtn">Login</button>

    <p class="register-link">
      Don't have an account? <a href="register.html">Register</a>
    </p>
    <p class="register-link">
      Admin? <a href="admin-login.html">Login here</a>
    </p>

    <button id="homeBtn" class="secondary-btn">Back to Home</button>

    <p id="statusMsg"></p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzMLug_TU5BW7fxEpAND4KiyVjeWcxcrs",
  authDomain: "college-location-app.firebaseapp.com",
  projectId: "college-location-app",
  storageBucket: "college-location-app.firebasestorage.app",
  messagingSenderId: "1000054805371",
  appId: "1:1000054805371:web:93f13c5f877dba7b6863de"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const statusMsg = document.getElementById("statusMsg");

document.getElementById("loginBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  statusMsg.style.color = "black";
  statusMsg.innerText = "Logging in...";

  signInWithEmailAndPassword(auth, email, password)
    .then(async (userCredential) => {
      const user = userCredential.user;
      const userSnap = await getDoc(doc(db, "users", user.uid));
      const userDoc = userSnap.exists() ? userSnap.data() : null;

      if (!userDoc) {
        await signOut(auth);
        statusMsg.style.color = "red";
        statusMsg.innerText = "Student profile not found. Please register again or contact admin.";
        return;
      }

      if (userDoc.role !== "student") {
        await signOut(auth);
        statusMsg.style.color = "red";
        statusMsg.innerText = "This login is for students only. Please use Admin Login.";
        return;
      }

      localStorage.setItem("loggedIn", "true");
      localStorage.setItem("userEmail", user.email);
      localStorage.setItem("userRole", "student");
      localStorage.setItem("userName", userDoc.name || "");

      statusMsg.style.color = "green";
      statusMsg.innerText = "Login successful! Redirecting...";

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 400);
    })
    .catch((error) => {
      statusMsg.style.color = "red";
      statusMsg.innerText = "Error: " + error.message;
    });
});

document.getElementById("homeBtn").addEventListener("click", () => {
  window.location.href = "index.html";
});
</script>

</body>
</html>
